[project]
name = "event-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "crispy-bootstrap5>=2026.9",
    "django==5.2",
    "django-crispy-forms>=2.7",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["events"]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "event_manager.settings"
python_files = ["test_*.py"]